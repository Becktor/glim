services:
  glim_ros2:
    image: koide3/glim_ros2:jazzy
    network_mode: host
    ipc: host
    pid: host
    environment:
      - DISPLAY
      - ROS_DOMAIN_ID
    volumes:
      - ../../config:/glim/config
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /home/jobe/bags/ros2:/glim/data
      - ../../config/tmux.conf:/home/jobe/.tmux.conf
    command: tail -F anything
